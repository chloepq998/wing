<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>날개 — 1인용 선택지 게임</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game">
    <header id="game-header">
      <h1 id="game-title">날개</h1>
    </header>

    <!-- 시작화면: 시점 선택 -->
    <section id="start-screen">
      <p id="start-desc">플레이할 시점을 선택하세요.</p>
      <div id="route-select">
        <button class="route-btn" id="route-wife" data-route="wife">아내로 플레이</button>
        <button class="route-btn" id="route-hero" data-route="hero">주인공으로 플레이</button>
      </div>
    </section>

    <!-- 스토리 화면 (선택한 시점 단독 진행) -->
    <main id="story" hidden>
      <div class="route-badge" id="route-badge"></div>
      <p class="story-text" id="story-text"></p>
      <div class="story-choices" id="story-choices"></div>
    </main>

    <!-- 엔딩 화면 -->
    <div id="ending" class="ending" hidden>
      <h2 id="ending-title" class="ending-title"></h2>
      <p id="ending-text" class="ending-text"></p>
      <button id="restart" class="restart-btn">처음으로</button>
    </div>
  </div>

  <!-- 데이터 먼저, 그다음 엔진 -->
  <script src="scenes.js"></script>
  <script src="game.js"></script>
</body>
</html>
