<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>날개 — 2인용 선택지 게임</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game">
    <header id="game-header">
      <h1 id="game-title">날개</h1>
    </header>

    <!-- 좌우 분할 본문 -->
    <main id="split">
      <!-- 왼쪽: 아내 플레이어 -->
      <section id="panel-left" class="panel" data-player="wife">
        <div class="panel-role">아내</div>
        <p class="panel-text" id="left-text"></p>
        <div class="panel-choices" id="left-choices"></div>
        <div class="panel-waiting" id="left-waiting" hidden>선택 완료 — 상대 대기 중…</div>
      </section>

      <div id="divider"></div>

      <!-- 오른쪽: 주인공 플레이어 -->
      <section id="panel-right" class="panel" data-player="hero">
        <div class="panel-role">주인공</div>
        <p class="panel-text" id="right-text"></p>
        <div class="panel-choices" id="right-choices"></div>
        <div class="panel-waiting" id="right-waiting" hidden>선택 완료 — 상대 대기 중…</div>
      </section>
    </main>

    <!-- 엔딩 화면 -->
    <div id="ending" class="ending" hidden>
      <h2 id="ending-title" class="ending-title"></h2>
      <div class="ending-body">
        <p id="ending-left" class="ending-text" data-player="wife"></p>
        <p id="ending-right" class="ending-text" data-player="hero"></p>
      </div>
      <button id="restart" class="restart-btn">다시 시작</button>
    </div>
  </div>

  <!-- 데이터 먼저, 그다음 엔진 -->
  <script src="scenes.js"></script>
  <script src="game.js"></script>
</body>
</html>
