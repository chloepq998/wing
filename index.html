<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>날개 - 아내 루트</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game">
    <div id="gauge-wrap">
      <div id="gauge-label">남편의 인내심</div>
      <div id="gauge-bar-bg">
        <div id="gauge-bar-fill"></div>
      </div>
      <div id="gauge-value">100%</div>
    </div>

    <div id="stage">
      <img id="background" src="" alt="" />
      <img id="character" src="" alt="" />
    </div>

    <div id="dialogue-box">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
      <div id="choices"></div>
    </div>

    <div id="ending-screen" class="hidden">
      <div id="ending-title"></div>
      <div id="ending-desc"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
